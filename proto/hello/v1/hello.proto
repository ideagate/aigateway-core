syntax = "proto3";

package hello.v1;

option go_package = "github.com/ideagate/aigateway-core/gen/hello/v1;hellov1";

// HelloService provides a simple greeting endpoint.
service HelloService {
  // SayHello returns a greeting message for the given name.
  rpc SayHello(SayHelloRequest) returns (SayHelloResponse);
}

// SayHelloRequest carries the name of the person to greet.
message SayHelloRequest {
  string name = 1;
}

// SayHelloResponse carries the greeting message.
message SayHelloResponse {
  string message = 1;
}
